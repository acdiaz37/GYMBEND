el fenómeno llamado \\\"golpear la pared\\\". Golpear la pared es normalmente una frase usada por corredores de larga distancia que llegan a un punto donde sienten como si sus cuerpos los estuvieran abandonando. Golpear la pared ocurre cuando las reservas de glucógeno de un atleta se agotan, sin embargo esta ocurrencia usualmente solo se ve en corredores de larga distancia.\u003cbr /\u003e\u003cbr /\u003e1 carbohidrato equivale a 4 kcal o Cal.\",\"macro_fats\":\"Grasas\",\"macro_fats_description\":\"Las grasas proporcionan energía durante ejercicios largos. Las grasas están menos disponibles que los carbohidratos en el cuerpo. La razón de esto es que el proceso que las grasas deben sufrir para transformarse en energía es más complejo que el de los carbohidratos. Las grasas deben descomponerse de su forma compleja original (triglicérido) en glicerol y ácidos grasos libres. Esos ácidos grasos libres pueden entonces ser usados por el cuerpo para formar energía.\\\\n\u003cbr /\u003e\u003cbr /\u003e\\\\nLas grasas hacen más que solo proporcionar energía. Algunos tipos de grasas (fosfolípidos) forman vainas protectoras alrededor de los nervios, mientras que otras sirven como bloques de construcción de hormonas importantes (estrógeno y testosterona).\\\\n\u003cbr /\u003e\u003cbr /\u003e\\\\nUna grasa equivale a aproximadamente 9 kcal o Cal.\",\"macro_proteins\":\"Proteínas\",\"macro_proteins_description\":\"Solo bajo circunstancias extremas se requiere proteína para la creación de energía. Para que la proteína sea usada como energía, debe convertirse en glucosa o ácidos grasos libres (FFAs). Sin conversión a glucosa o FFAs, solo los aminoácidos pueden ser utilizados para energía.\\\\n\u003cbr /\u003e\u003cbr /\u003e\\\\nLas proteínas brillan como bloques de construcción. La proteína puede servir como base para la creación de nuevos tejidos. Las proteínas específicas llamadas enzimas aceleran o ralentizan las reacciones químicas que ocurren en el cuerpo.\\\\n\u003cbr /\u003e\u003cbr /\u003e\\\\nLa proteína equivale a aproximadamente 4 kcal o Cal.\",\"faq_title\":\"Preguntas frecuentes\",\"faq_header\":\"¿Tienes una pregunta diferente y no puedes encontrar la respuesta que buscas? Ponte en contacto con nuestro equipo de soporte \u003ca href=\\\"mailto:support@musclewiki.com\\\"\u003e\u003cspan class=\\\"font-semibold text-mw-blue hover:text-mw-blue-500\\\"\u003e enviándonos un correo electrónico\u003c/span\u003e\u003c/a\u003e y te responderemos tan pronto como podamos.\",\"macro_faq_q_1\":\"P: ¿Necesito tomar carbohidratos justo después de un entrenamiento para restaurar mis reservas de glucógeno?\",\"macro_faq_a_1\":\"R: Solo bajo dos circunstancias. Si hiciste cardio intenso (el cardio usa significativamente más glucógeno que el entrenamiento con pesas), y si entrenas más de una vez al día. De lo contrario, no hay necesidad de \\\"restaurar glucógeno\\\". El cuerpo humano es muy bueno manteniendo las reservas de glucógeno y las restaurará en menos de 24 horas.\",\"macro_faq_q_2\":\"P: ¿Necesito tomar batidos de proteína?\",\"macro_faq_a_2\":\"R: No. Si puedes consumir todas tus necesidades de proteína con alimentos enteros, entonces definitivamente deberías hacer eso en su lugar. De hecho, la investigación sugiere que las fuentes de proteína completa (como pollo y pescado) son mejores apoyando la construcción muscular que los batidos de proteína.\",\"macro_faq_q_3\":\"P: Todos dicen que las grasas son malas. ¿Es eso cierto?\",\"macro_faq_a_3\":\"R: Las grasas son una parte necesaria de la dieta. Hay formas no saludables de grasa (principalmente encontradas en alimentos fritos). Sin embargo, los tipos de grasa que encuentras en nueces, pescado y aceites son saludables y deberían ser consumidos para una producción hormonal saludable.\",\"goal_extreme_loss_metric\":\"Pérdida de peso extrema (1 kg/semana)\",\"goal_weight_loss_metric\":\"Pérdida de peso (0.5 kg/semana)\",\"goal_mild_loss_metric\":\"Pérdida de peso leve (0.25 kg/semana)\",
